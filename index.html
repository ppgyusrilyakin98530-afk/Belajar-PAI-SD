<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belajar PAI SD</title>
<style>
:root{--bg:#f6f4ec;--card:#fff;--tx:#1f2a24;--mu:#5b6b62;--pri:#1b7f5c;--onpri:#fff;--ok:#1b7f5c;--no:#c0392b;--bd:#dcd8c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#101814;--card:#1a2520;--tx:#e8efe9;--mu:#9fb2a7;--pri:#3fbf92;--onpri:#06251a;--ok:#3fbf92;--no:#ff7a6b;--bd:#2c3b34}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
h1{font-size:1.25rem;margin:0}
.badge{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px 12px;font-size:.9rem;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button{font:inherit;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;text-align:left;width:100%}
button:hover:not(:disabled){border-color:var(--pri)}
button.c{text-align:center;font-weight:700;font-size:1.3rem;padding:18px 0}
button.p{background:var(--pri);color:var(--onpri);border-color:var(--pri);text-align:center;font-weight:700}
button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
button.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--card))}
.opts{display:grid;gap:10px;margin:14px 0}
.mu{color:var(--mu);font-size:.85rem}
.fb{border-left:4px solid var(--pri);padding:8px 12px;margin:12px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--pri)}
.sp{text-align:center;padding:32px 0;color:var(--mu)}
</style>
</head>
<body>
<main>
<header><h1>🌙 Belajar PAI</h1><div class="badge" id="stat"></div></header>
<div id="app"></div>
<p class="mu" style="text-align:center;margin-top:24px">Soal dibuat otomatis oleh AI. Guru dan orang tua sebaiknya ikut mendampingi.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ISI DUA NILAI INI. Publishable key aman ada di browser. JANGAN pernah taruh secret key atau API key Claude di sini.
const SUPABASE_URL="https://GANTI-PROJECT.supabase.co";
const SUPABASE_KEY="sb_publishable_GANTI";

// Label tombol saja. Soal TIDAK ada di sini. Urutan harus sama dengan TOPIK di Edge Function.
const TOPIK={
1:["Mengenal Allah dan Asmaul Husna","Doa sehari-hari","Rukun Islam","Berbakti kepada orang tua","Bersuci dan kebersihan"],
2:["Rukun Iman","Salat lima waktu","Jujur dan sopan santun","Kisah masa kecil Nabi Muhammad saw.","Doa makan dan doa tidur"],
3:["Asmaul Husna dalam kehidupan","Tata cara wudu dan salat","Hormat kepada guru dan teman","Kisah Nabi Ibrahim a.s.","Puasa Ramadan"],
4:["Perilaku amanah dan jujur dalam menggunakan teknologi","Iman kepada malaikat Allah","Zakat dan sedekah","Kisah Nabi Yusuf a.s.","Toleransi antarteman"],
5:["Iman kepada kitab-kitab Allah","Salat berjamaah dan salat Jumat","Menjaga lisan di media sosial","Kisah Khulafaur Rasyidin","Menghargai perbedaan"],
6:["Iman kepada qada dan qadar","Ibadah haji dan umrah","Adab bermedia digital dan anti-perundungan","Kisah Walisongo","Menjaga lingkungan sebagai amanah"]
};
const $app=document.getElementById('app'),$stat=document.getElementById('stat');
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let S={xp:0,jawab:0,benar:0,streak:0},kelas=0,topikIdx=-1;

function h(t,a,...c){const e=document.createElement(t);for(const k in(a||{})){if(k==='on')for(const n in a.on)e.addEventListener(n,a.on[n]);else if(k==='cls')e.className=a[k];else e.setAttribute(k,a[k])}c.flat().forEach(x=>e.append(x));return e}
function stat(){$stat.textContent="Level "+(Math.floor(S.xp/50)+1)+" · "+S.xp+" XP"+(S.streak>1?" · 🔥"+S.streak:"")}
function view(...n){$app.replaceChildren(...n);stat();window.scrollTo(0,0)}
function err(msg,retry){view(h('div',{cls:'card'},msg),h('div',{cls:'row'},h('button',{cls:'p',on:{click:retry}},"Coba lagi"),h('button',{on:{click:home}},"Ke beranda")))}

async function api(body){
  const{data,error}=await sb.functions.invoke('pai',{body});
  if(error){const e=new Error('api');e.status=error.context&&error.context.status;throw e}
  return data;
}

async function init(){
  view(h('div',{cls:'sp'},"⏳ Menyiapkan…"));
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(!session){const{error}=await sb.auth.signInAnonymously();if(error)throw error}
    S=await api({aksi:'profil'});
    home();
  }catch(e){err("Gagal terhubung ke server.",init)}
}

function home(){
  view(
    h('div',{cls:'card'},h('b',{},"Pilih kelasmu"),h('div',{cls:'mu'},S.jawab+" soal dijawab, "+S.benar+" benar"),h('div',{cls:'bar'},h('i',{style:'width:'+((S.xp%50)*2)+'%'}))),
    h('div',{cls:'grid'},[1,2,3,4,5,6].map(k=>h('button',{cls:'c',on:{click:()=>{kelas=k;topics()}}},"Kelas "+k)))
  );
}
function topics(){
  view(
    h('div',{cls:'card'},h('b',{},"Kelas "+kelas+": pilih materi")),
    h('div',{cls:'opts'},
      TOPIK[kelas].map((t,i)=>h('button',{on:{click:()=>{topikIdx=i;next()}}},t)),
      h('button',{cls:'p',on:{click:()=>{topikIdx=-1;next()}}},"🎲 Acak materi")),
    h('button',{on:{click:home}},"← Ganti kelas")
  );
}

async function next(){
  view(h('div',{cls:'sp'},"⏳ Engine sedang menyiapkan soal baru…"));
  try{quiz(await api({aksi:'buat',kelas,topik_idx:topikIdx}))}
  catch(e){err(e.status===429?"Pelan-pelan ya, tunggu sebentar lalu coba lagi.":"Soal gagal dibuat. Coba lagi ya.",next)}
}

function quiz(q){
  let done=false;const fb=h('div'),btns=[];
  q.pilihan.forEach((t,i)=>{
    const b=h('button',{on:{click:async()=>{
      if(done)return;done=true;btns.forEach(x=>x.disabled=true);
      fb.replaceChildren(h('div',{cls:'mu'},"Memeriksa jawaban…"));
      try{
        const r=await api({aksi:'jawab',soal_id:q.soal_id,pilihan:i});
        btns[r.indeks_benar].classList.add('ok');
        if(r.benar){fb.replaceChildren(h('div',{cls:'fb'},h('b',{},"✅ Benar! +"+r.xp_tambah+" XP"),h('div',{},r.pembahasan)))}
        else{b.classList.add('no');fb.replaceChildren(h('div',{cls:'fb',style:'border-color:var(--no)'},h('b',{},"❌ Belum tepat. Jangan menyerah!"),h('div',{},r.pembahasan)))}
        S=r.profil;stat();
        fb.append(h('div',{cls:'row'},h('button',{cls:'p',on:{click:next}},"Soal berikutnya"),h('button',{on:{click:topics}},"Ganti materi")));
      }catch(e){fb.replaceChildren(h('div',{cls:'fb',style:'border-color:var(--no)'},"Jawaban gagal dikirim."),h('button',{on:{click:topics}},"Ganti materi"))}
    }}},t);
    btns.push(b);
  });
  view(
    h('div',{cls:'card'},h('div',{cls:'mu'},"Kelas "+q.kelas+" · "+q.topik),h('p',{style:'margin:8px 0 0'},q.soal)),
    h('div',{cls:'opts'},btns),fb,h('div',{cls:'mu'},"ID soal: "+q.kode)
  );
}
init();
</script>
</body>
</html>
